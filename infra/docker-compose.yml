services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"

  control-plane:
    build: ../control-plane
    environment:
      NATS_URL: nats://nats:4222
      TOPOLOGY_PATH: /app/topology.yaml
      HTTP_ADDR: :8080
      ACTIONS_LOG_PATH: /app/logs/actions.jsonl
      GRAFANA_URL: http://grafana:3000
    volumes:
      - ./topology.yaml:/app/topology.yaml:ro
      - ../experiments/logs:/app/logs
    ports:
      - "8080:8080"
    depends_on:
      - nats

  agent-n1:
    build: ../agent
    environment:
      NODE_ID: n1
      NATS_URL: nats://nats:4222
      TOPOLOGY_PATH: /app/topology.yaml
      SEED: "42"
    volumes:
      - ./topology.yaml:/app/topology.yaml:ro
    depends_on:
      - nats

  agent-n2:
    build: ../agent
    environment:
      NODE_ID: n2
      NATS_URL: nats://nats:4222
      TOPOLOGY_PATH: /app/topology.yaml
      SEED: "42"
    volumes:
      - ./topology.yaml:/app/topology.yaml:ro
    depends_on:
      - nats

  agent-n3:
    build: ../agent
    environment:
      NODE_ID: n3
      NATS_URL: nats://nats:4222
      TOPOLOGY_PATH: /app/topology.yaml
      SEED: "42"
    volumes:
      - ./topology.yaml:/app/topology.yaml:ro
    depends_on:
      - nats

  agent-n4:
    build: ../agent
    environment:
      NODE_ID: n4
      NATS_URL: nats://nats:4222
      TOPOLOGY_PATH: /app/topology.yaml
      SEED: "42"
    volumes:
      - ./topology.yaml:/app/topology.yaml:ro
    depends_on:
      - nats

  agent-n5:
    build: ../agent
    environment:
      NODE_ID: n5
      NATS_URL: nats://nats:4222
      TOPOLOGY_PATH: /app/topology.yaml
      SEED: "42"
    volumes:
      - ./topology.yaml:/app/topology.yaml:ro
    depends_on:
      - nats

  agent-n6:
    build: ../agent
    environment:
      NODE_ID: n6
      NATS_URL: nats://nats:4222
      TOPOLOGY_PATH: /app/topology.yaml
      SEED: "42"
    volumes:
      - ./topology.yaml:/app/topology.yaml:ro
    depends_on:
      - nats

  # One-shot tools: not started by `docker compose up` (profile "tools"),
  # run on demand with `docker compose run --rm loadgen ...` / `... chaos ...`.
  # The same binaries also run directly from the host against localhost:4222
  # (see loadgen/ and chaos/ READMEs / Makefile targets).
  loadgen:
    build: ../loadgen
    profiles: ["tools"]
    environment:
      NATS_URL: nats://nats:4222
      TOPOLOGY_PATH: /app/topology.yaml
      LOGS_DIR: /app/logs
      GRAFANA_URL: http://grafana:3000
    volumes:
      - ./topology.yaml:/app/topology.yaml:ro
      - ../experiments/logs:/app/logs
    depends_on:
      - nats

  chaos:
    build: ../chaos
    profiles: ["tools"]
    environment:
      NATS_URL: nats://nats:4222
      LOGS_DIR: /app/logs
      GRAFANA_URL: http://grafana:3000
    volumes:
      - ../experiments/logs:/app/logs
    depends_on:
      - nats

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - agent-n1
      - agent-n2
      - agent-n3
      - agent-n4
      - agent-n5
      - agent-n6

  causal-engine:
    build: ../causal-engine
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      TOPOLOGY_PATH: /app/topology.yaml
      GRAFANA_URL: http://grafana:3000
      CONTROL_PLANE_URL: http://control-plane:8080
      ACTIONS_LOG_PATH: /app/logs/actions.jsonl
    volumes:
      - ./topology.yaml:/app/topology.yaml:ro
      - ../experiments/logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      - prometheus
      - control-plane

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
