# Shared network definition. Both agent/ and control-plane/ read this file
# directly (mounted into their containers) so node/link data lives in one
# place. Ring of 6 nodes plus 3 diagonals so it behaves like a small mesh.
nodes:
  - id: n1
    baseline: { throughput_mbps: 120, latency_ms: 8, queue_depth: 5, packet_loss_pct: 0.05 }
  - id: n2
    baseline: { throughput_mbps: 100, latency_ms: 10, queue_depth: 4, packet_loss_pct: 0.05 }
  - id: n3
    baseline: { throughput_mbps: 140, latency_ms: 7, queue_depth: 6, packet_loss_pct: 0.03 }
  - id: n4
    baseline: { throughput_mbps: 110, latency_ms: 9, queue_depth: 5, packet_loss_pct: 0.06 }
  - id: n5
    baseline: { throughput_mbps: 130, latency_ms: 8, queue_depth: 4, packet_loss_pct: 0.04 }
  - id: n6
    baseline: { throughput_mbps: 90,  latency_ms: 12, queue_depth: 7, packet_loss_pct: 0.07 }

links:
  # ring — bandwidth is deliberately close to the nodes' own baseline
  # throughput (not a "real" backbone number) so a load spike can actually
  # saturate a node in Phase 2's queueing model.
  - { from: n1, to: n2, bandwidth_mbps: 400, base_latency_ms: 2 }
  - { from: n2, to: n3, bandwidth_mbps: 400, base_latency_ms: 2 }
  - { from: n3, to: n4, bandwidth_mbps: 400, base_latency_ms: 2 }
  - { from: n4, to: n5, bandwidth_mbps: 400, base_latency_ms: 2 }
  - { from: n5, to: n6, bandwidth_mbps: 400, base_latency_ms: 2 }
  - { from: n6, to: n1, bandwidth_mbps: 400, base_latency_ms: 2 }
  # diagonals: intentionally the weakest link on every node, so each node's
  # capacity (the minimum bandwidth over its attached links) is 250 Mbps —
  # the diagonal is always the bottleneck.
  - { from: n1, to: n4, bandwidth_mbps: 250, base_latency_ms: 5 }
  - { from: n2, to: n5, bandwidth_mbps: 250, base_latency_ms: 5 }
  - { from: n3, to: n6, bandwidth_mbps: 250, base_latency_ms: 5 }
